    <style>

<body>
    <div class="container">
        <header>
            <h1>📊 DCA Trading Analysis</h1>
            <p class="subtitle">Log 파일을 업로드하여 DCA 익절 현황을 분석하세요 (대용량 지원)</p>
        </header>

        <div class="upload-section" id="uploadSection">
            <div class="upload-icon">📁</div>
            <div class="upload-text">여기에 파일을 드래그하거나 클릭하여 업로드</div>
            <div class="upload-hint">지원 형식: .log, .txt (대용량 파일 지원)</div>
            <button class="btn btn-primary" id="selectFileBtn">파일 선택</button>
            <input type="file" id="fileInput" multiple accept=".log,.txt">
        </div>

        <div class="file-list" id="fileList">
            <div style="font-weight: 600; margin-bottom: 10px;">선택된 파일:</div>
            <div id="fileItems"></div>
        </div>

        <div class="success-message" id="successMessage"></div>

        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <div class="results-title">분석 결과</div>
                <button class="btn btn-secondary" id="exportBtn">📥 Excel로 다운로드</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">총 익절 횟수</div>
                    <div class="stat-value" id="totalTakeProfit">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">총 그룹 수</div>
                    <div class="stat-value" id="totalGroups">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">최대 DCA 단계</div>
                    <div class="stat-value" id="maxDCAStep">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">평균 DCA 단계</div>

            <div class="table-container">

                <div class="legend-bar"></div>
                <div class="legend-labels">
                    <span>최소</span>

        </div>

        <div class="footer">
            <p>© 2026 DCA Trading Analysis Tool | GitHub Pages</p>

    <script>
        let selectedFiles = [];
        let mergedGroupMap = {};
        let currentMaxDCA = 0;
        let currentTotalProfitCount = 0;
        let currentTotalDcaSum = 0;
        let currentMaxUnrealizedColumns = 0;

        const CHUNK_SIZE = 5 * 1024 * 1024;
        const RECORD_START_REGEX = /\[\d{4}-\d{2}-\d{2} [^\]]+\]\[DEBUG\|[^\]]+\] >> \[\d{4}\/\d{2}\/\d{2} \d{2}:\d{2}\] \[(?:Open|Close|SYSTEM)\] :/g;
        const RECORD_START_SINGLE = /\[\d{4}-\d{2}-\d{2} [^\]]+\]\[DEBUG\|[^\]]+\] >> \[\d{4}\/\d{2}\/\d{2} \d{2}:\d{2}\] \[(?:Open|Close|SYSTEM)\] :/;

        function normalizeGroupName(name) {
            if (!name) return null;

            const cleaned = String(name)
                .trim()
                .replace(/\s+/g, ' ');

            if (!cleaned || cleaned.length === 0) return null;
            return cleaned;
        }

        function ensureGroup(groupName) {
            const key = normalizeGroupName(groupName);
            if (!key) return null;

            if (!mergedGroupMap[key]) {
                mergedGroupMap[key] = {
                    dca: {},
                    stopLoss: 0,
                    unrealizedSteps: []
                };
            }
            return key;
        }

        function getSortedUnrealizedSteps(groupName) {
            const steps = (mergedGroupMap[groupName]?.unrealizedSteps || []).slice();
            steps.sort((a, b) => a - b);
            return steps;
        }

        function getVisibleGroups(groupMap) {
            return Object.keys(groupMap).filter(group => {
                const dcaObj = groupMap[group].dca || {};
                const profitTotal = Object.values(dcaObj).reduce((a, b) => a + b, 0);
                const stop = groupMap[group].stopLoss || 0;
                const unrealizedCount = (groupMap[group].unrealizedSteps || []).length;
                return (profitTotal > 0 || stop > 0 || unrealizedCount > 0);
            });
        }

        function getCommonColor(value, minVal, maxVal) {
            if (value === 0) return { hex: 'CCCCCC', rgb: 'rgba(200, 200, 200, 0.3)' };
            if (minVal === maxVal) return { hex: 'EF5350', rgb: '#ef5350' };

            const logMin = Math.log(minVal + 1);
            const logMax = Math.log(maxVal + 1);
            const logVal = Math.log(value + 1);
            const normalizedValue = (logVal - logMin) / (logMax - logMin);

            let r, g, b;
            if (normalizedValue < 0.3) {
                const t = normalizedValue / 0.3;
                r = Math.round(165 + (255 - 165) * t);
                g = 214;
                b = Math.round(167 + (79 - 167) * t);
            } else if (normalizedValue < 0.7) {
                const t = (normalizedValue - 0.3) / 0.4;
                r = 255;
                g = Math.round(214 + (180 - 214) * t);
                b = Math.round(79 + (0 - 79) * t);
            } else {
                const t = (normalizedValue - 0.7) / 0.3;
                r = 255;
                g = Math.round(180 + (0 - 180) * t);
                b = 0;
            }

            const toHex = (c) => c.toString(16).padStart(2, '0').toUpperCase();
            return {
                hex: `${toHex(r)}${toHex(g)}${toHex(b)}`,
                rgb: `rgb(${r}, ${g}, ${b})`
            };
        }

        function paintHtmlValueCell(td, value, minVal, maxVal, emptyText = '-') {
            if (value === null || value === undefined || value === '') {
                td.textContent = emptyText;
                td.style.color = '#ccc';
                return;
            }

            const numericValue = Number(value);
            if (Number.isNaN(numericValue)) {
                td.textContent = emptyText;
                td.style.color = '#ccc';
                return;
            }

            const color = getCommonColor(numericValue, minVal, maxVal);
            td.textContent = numericValue;
            td.style.backgroundColor = color.rgb;

            if (numericValue === 0) {
                td.classList.add('zero-color-cell');
            } else {
                td.classList.add('color-cell');
            }
        }

        function paintExcelValueCell(cell, value, minVal, maxVal, allowZeroColor = true) {
            if (value === null || value === undefined || value === '') {
                cell.value = '';
                return;
            }

            const numericValue = Number(value);
            if (Number.isNaN(numericValue)) {
                cell.value = '';
                return;
            }

            cell.value = numericValue;
            const color = getCommonColor(numericValue, minVal, maxVal);
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + color.hex } };

            if (numericValue === 0 && allowZeroColor) {
                cell.font = { color: { argb: 'FF666666' }, bold: true };
            } else {
                cell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
            }
        }

        class StreamDcaParser {
            constructor() {
                this.buffer = '';
                this.MAX_BUFFER = 12 * 1024 * 1024;
                this.TAIL_KEEP = 2 * 1024 * 1024;
                this.groupLiveState = {};
            }

            getLiveState(groupName) {
                if (!this.groupLiveState[groupName]) {
                    this.groupLiveState[groupName] = {
                        step: 0,
                        maxStep: 0
                    };
                }
                return this.groupLiveState[groupName];
            }

            processChunk(chunk) {
                this.buffer += chunk;
                this.extractRecords(false);

                if (this.buffer.length > this.MAX_BUFFER) {
                    this.buffer = this.buffer.slice(-this.TAIL_KEEP);
                }
            }

            finalize() {
                this.extractRecords(true);
                this.buffer = '';
            }

            extractRecords(force = false) {
                if (!this.buffer) return;

                const firstStartIndex = this.buffer.search(RECORD_START_SINGLE);
                if (firstStartIndex === -1) {
                    if (force) {
                        this.buffer = '';
                    }
                    return;
                }

                if (firstStartIndex > 0) {
                    this.buffer = this.buffer.slice(firstStartIndex);
                }

                const starts = [];
                let match;
                RECORD_START_REGEX.lastIndex = 0;
                while ((match = RECORD_START_REGEX.exec(this.buffer)) !== null) {
                    starts.push(match.index);
                }

                if (starts.length === 0) return;

                for (let i = 0; i < starts.length - 1; i++) {
                    const record = this.buffer.slice(starts[i], starts[i + 1]);
                    this.processRecord(record);
                }

                if (force) {
                    const lastRecord = this.buffer.slice(starts[starts.length - 1]);
                    this.processRecord(lastRecord);
                    this.buffer = '';
                } else {
                    this.buffer = this.buffer.slice(starts[starts.length - 1]);
                }
            }

            processRecord(record) {
                if (!record) return;

                const openDcaMatch = record.includes('[Open] :')
                    ? record.match(/□\s*DCA\s*(\d+)\s*\/\s*(\d+)[\s\S]*?-\s*GROUP\s*:\s*([^\r\n]+)/)
                    : null;

                if (openDcaMatch) {
                    const step = parseInt(openDcaMatch[1], 10);
                    const maxStep = parseInt(openDcaMatch[2], 10);
                    const key = ensureGroup(openDcaMatch[3]);
                    if (!key || Number.isNaN(step) || Number.isNaN(maxStep)) return;

                    const liveState = this.getLiveState(key);
                    liveState.step = step;
                    liveState.maxStep = maxStep;
                    return;
                }

                const closeMatch = record.includes('[Close] :')
                    ? record.match(/□\s*(PROFIT|LOSS)\s*\[.*?\][\s\S]*?-\s*GROUP\s*:\s*([^\r\n]+)[\s\S]*?-\s*DCA\s*:\s*(\d+)\s*\/\s*(\d+)/)
                    : null;

                if (closeMatch) {
                    const closeType = closeMatch[1];
                    const key = ensureGroup(closeMatch[2]);
                    const dcaStep = parseInt(closeMatch[3], 10);
                    const maxStep = parseInt(closeMatch[4], 10);

                    if (!key || Number.isNaN(dcaStep) || Number.isNaN(maxStep)) return;

                    if (closeType === 'PROFIT') {
                        if (!mergedGroupMap[key].dca[dcaStep]) {
                            mergedGroupMap[key].dca[dcaStep] = 0;
                        }
                        mergedGroupMap[key].dca[dcaStep]++;
                        currentMaxDCA = Math.max(currentMaxDCA, dcaStep);
                        currentTotalProfitCount++;
                        currentTotalDcaSum += dcaStep;
                    }

                    const liveState = this.getLiveState(key);
                    liveState.step = 0;
                    liveState.maxStep = maxStep;
                    return;
                }

                const reportMatch = record.match(/\[Backtest Report\][\s\S]*?-\s*Group\s*Name\s*:\s*(.*?)\s*(?:\r?\n)[\s\S]*?-\s*총\s*손절\s*(?:회수|횟수)\s*:\s*([\d,]+)/i);
                if (reportMatch) {
                    const key = ensureGroup(reportMatch[1]);
                    if (!key) return;

                    const stopLossCount = parseInt(String(reportMatch[2]).replace(/,/g, ''), 10);
                    mergedGroupMap[key].stopLoss += (Number.isNaN(stopLossCount) ? 0 : stopLossCount);

                    const liveState = this.getLiveState(key);
                    const unrealizedStep = Number.isFinite(liveState.step) ? liveState.step : 0;
                    mergedGroupMap[key].unrealizedSteps.push(unrealizedStep);
                    currentMaxUnrealizedColumns = Math.max(currentMaxUnrealizedColumns, mergedGroupMap[key].unrealizedSteps.length);
                }
            }
        }

        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const selectFileBtn = document.getElementById('selectFileBtn');

        selectFileBtn.addEventListener('click', () => fileInput.click());

        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            selectedFiles = Array.from(files);
            updateFileList();

            if (selectedFiles.length > 0) {
                setTimeout(() => {
                    analyzeFiles();
                }, 300);
            }
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            const fileItems = document.getElementById('fileItems');

            if (selectedFiles.length === 0) {
                fileList.style.display = 'none';
                return;
            }

            fileList.style.display = 'block';
            fileItems.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <div>
                        <div class="file-name">${file.name}</div>
                        <div class="file-size">${(file.size / 1024 / 1024).toFixed(2)} MB</div>
                    </div>
                    <div class="remove-file" onclick="removeFile(${index})">제거</div>
                </div>
            `).join('');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
            if (selectedFiles.length === 0) {
                document.getElementById('resultsSection').style.display = 'none';
                document.getElementById('uploadSection').style.display = 'block';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = '✅ ' + message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        function analyzeFiles() {
            mergedGroupMap = {};
            currentMaxDCA = 0;
            currentTotalProfitCount = 0;
            currentTotalDcaSum = 0;
            currentMaxUnrealizedColumns = 0;

            const loading = document.getElementById('loading');
            const progressText = document.getElementById('progressText');
            loading.style.display = 'block';

            const totalFiles = selectedFiles.length;

            const processNextFile = (fileIndex) => {
                if (fileIndex >= totalFiles) {
                    finishAnalysis();
                    return;
                }

                const file = selectedFiles[fileIndex];
                const fileSize = file.size;
                let offset = 0;
                let parser = new StreamDcaParser();
                let chunkReader = new FileReader();

                chunkReader.onload = function(e) {
                    const chunkText = e.target.result;
                    parser.processChunk(chunkText);
                    e.target.result = null;

                    offset += CHUNK_SIZE;

                    const percent = Math.min(100, Math.round((offset / fileSize) * 100));
                    const totalPercent = Math.round(((fileIndex * 100) + percent) / totalFiles);
                    progressText.innerText = `${totalPercent}% (파일 ${fileIndex + 1}/${totalFiles} 처리 중)`;

                    if (offset < fileSize) {
                        setTimeout(readNextChunk, 0);
                    } else {
                        parser.finalize();
                        parser = null;
                        chunkReader = null;
                        setTimeout(() => processNextFile(fileIndex + 1), 10);
                    }
                };

                chunkReader.onerror = function() {
                    console.error('Read Error', file.name);
                    showError(`${file.name} 읽기 실패`);
                    document.getElementById('loading').style.display = 'none';
                };

                function readNextChunk() {
                    const slice = file.slice(offset, offset + CHUNK_SIZE);
                    chunkReader.readAsText(slice, 'UTF-8');
                }

                readNextChunk();
            };

            processNextFile(0);
        }

        function finishAnalysis() {
            document.getElementById('loading').style.display = 'none';

            const visibleGroups = getVisibleGroups(mergedGroupMap);
            if (currentTotalProfitCount === 0 && visibleGroups.length === 0) {
                showError('분석할 수 있는 데이터가 없습니다. 로그 파일 형식을 확인하세요.');
                return;
            }

            renderResults();
            showSuccess(`${selectedFiles.length}개 파일 분석 완료!`);
        }

        function renderResults() {
            const totalGroups = getVisibleGroups(mergedGroupMap).length;
            const avgDCA = currentTotalProfitCount > 0
                ? (currentTotalDcaSum / currentTotalProfitCount).toFixed(2)
                : 0;

            document.getElementById('totalTakeProfit').textContent = currentTotalProfitCount.toLocaleString();
            document.getElementById('totalGroups').textContent = totalGroups.toLocaleString();
            document.getElementById('maxDCAStep').textContent = currentMaxDCA;
            document.getElementById('avgDCAStep').textContent = avgDCA;

            generateTable(mergedGroupMap, currentMaxDCA, currentMaxUnrealizedColumns);

            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('fileList').style.display = 'none';
        }

        function generateTable(groupMap, maxDCA, maxUnrealizedColumns) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            thead.innerHTML = '';
            tbody.innerHTML = '';

            const headerRow = document.createElement('tr');
            headerRow.innerHTML = '<th>그룹명</th>';

            for (let i = 0; i <= maxDCA; i++) {
                const th = document.createElement('th');
                th.textContent = `${i} DCA`;
                headerRow.appendChild(th);
            }

            const thTotal = document.createElement('th');
            thTotal.textContent = 'Total';
            headerRow.appendChild(thTotal);

            const thStopLoss = document.createElement('th');
            thStopLoss.textContent = '손절';
            thStopLoss.style.backgroundColor = '#fff3e0';
            headerRow.appendChild(thStopLoss);

            const thSpacer = document.createElement('th');
            thSpacer.textContent = '';
            thSpacer.className = 'spacer-cell';
            headerRow.appendChild(thSpacer);

            for (let i = 1; i <= maxUnrealizedColumns; i++) {
                const th = document.createElement('th');
                th.textContent = `미실현차수 ${i}`;
                th.style.backgroundColor = '#eef7ff';
                headerRow.appendChild(th);
            }

            thead.appendChild(headerRow);

            const allDcaValues = [];
            const stopValues = [];
            const unrealizedPositiveValues = [];
            const rows = [];

            getVisibleGroups(groupMap).forEach(group => {
                let rowTotal = 0;
                const rowData = [];

                for (let i = 0; i <= maxDCA; i++) {
                    const value = groupMap[group].dca[i] || 0;
                    rowData.push(value);
                    rowTotal += value;
                    if (value > 0) allDcaValues.push(value);
                }

                const stopLossCount = groupMap[group].stopLoss || 0;
                if (stopLossCount > 0) stopValues.push(stopLossCount);

                const unrealizedSteps = getSortedUnrealizedSteps(group);
                unrealizedSteps.forEach(step => {
                    if (step > 0) unrealizedPositiveValues.push(step);
                });

                rows.push({
                    group,
                    data: rowData,
                    total: rowTotal,
                    stopLoss: stopLossCount,
                    unrealizedSteps
                });
            });

            rows.sort((a, b) => {
                if (b.total !== a.total) return b.total - a.total;
                return a.group.localeCompare(b.group);
            });

            const minDca = allDcaValues.length > 0 ? Math.min(...allDcaValues) : 0;
            const maxDcaVal = allDcaValues.length > 0 ? Math.max(...allDcaValues) : 0;
            const minStop = stopValues.length > 0 ? Math.min(...stopValues) : 0;
            const maxStop = stopValues.length > 0 ? Math.max(...stopValues) : 0;
            const minUnrealized = unrealizedPositiveValues.length > 0 ? Math.min(...unrealizedPositiveValues) : 0;
            const maxUnrealized = unrealizedPositiveValues.length > 0 ? Math.max(...unrealizedPositiveValues) : 0;

            const fragment = document.createDocumentFragment();

            rows.forEach(row => {
                const tr = document.createElement('tr');

                const tdGroup = document.createElement('td');
                tdGroup.textContent = row.group;
                tr.appendChild(tdGroup);

                row.data.forEach(value => {
                    const td = document.createElement('td');
                    if (value > 0) {
                        paintHtmlValueCell(td, value, minDca, maxDcaVal);
                    } else {
                        td.textContent = '-';
                        td.style.color = '#ccc';
                    }
                    tr.appendChild(td);
                });

                const tdTotal = document.createElement('td');
                tdTotal.style.fontWeight = '800';
                tdTotal.style.backgroundColor = '#f0f0f0';
                tdTotal.textContent = row.total;
                tr.appendChild(tdTotal);

                const tdStopLoss = document.createElement('td');
                if (row.stopLoss > 0) {
                    paintHtmlValueCell(tdStopLoss, row.stopLoss, minStop, maxStop);
                } else {
                    tdStopLoss.textContent = '-';
                    tdStopLoss.style.color = '#ccc';
                }
                tr.appendChild(tdStopLoss);

                const spacerTd = document.createElement('td');
                spacerTd.className = 'spacer-cell';
                spacerTd.textContent = '';
                tr.appendChild(spacerTd);

                for (let i = 0; i < maxUnrealizedColumns; i++) {
                    const td = document.createElement('td');
                    if (i < row.unrealizedSteps.length) {
                        paintHtmlValueCell(td, row.unrealizedSteps[i], minUnrealized, maxUnrealized, '');
                    } else {
                        td.textContent = '';
                    }
                    tr.appendChild(td);
                }

                fragment.appendChild(tr);
            });

            tbody.appendChild(fragment);
        }

        async function exportToExcel() {
            if (Object.keys(mergedGroupMap).length === 0) {
                showError('내보낼 데이터가 없습니다.');
                return;
            }

            try {
                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet('DCA Summary');

                const headers = ['그룹명'];
                for (let i = 0; i <= currentMaxDCA; i++) headers.push(`${i} DCA`);
                headers.push('Total', '손절', '');
                for (let i = 1; i <= currentMaxUnrealizedColumns; i++) headers.push(`미실현차수 ${i}`);

                const headerRow = worksheet.addRow(headers);
                headerRow.eachCell((cell, colNumber) => {
                    const headerValue = headers[colNumber - 1];

                    if (headerValue === '손절') {
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF3E0' } };
                    } else if (String(headerValue).startsWith('미실현차수')) {
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEF7FF' } };
                    } else if (headerValue === '') {
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFFFF' } };
                    } else {
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE0E0E0' } };
                    }

                    cell.font = { bold: true, size: 11 };
                    cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    cell.border = {
                        top: { style: 'thin' }, left: { style: 'thin' },
                        bottom: { style: 'thin' }, right: { style: 'thin' }
                    };
                });

                const allDcaValues = [];
                const stopValues = [];
                const unrealizedPositiveValues = [];
                const rows = [];

                getVisibleGroups(mergedGroupMap).forEach(group => {
                    let rowTotal = 0;
                    const rowData = [];

                    for (let i = 0; i <= currentMaxDCA; i++) {
                        const value = mergedGroupMap[group].dca[i] || 0;
                        rowData.push(value);
                        rowTotal += value;
                        if (value > 0) allDcaValues.push(value);
                    }

                    const stopLossCount = mergedGroupMap[group].stopLoss || 0;
                    if (stopLossCount > 0) stopValues.push(stopLossCount);

                    const unrealizedSteps = getSortedUnrealizedSteps(group);
                    unrealizedSteps.forEach(step => {
                        if (step > 0) unrealizedPositiveValues.push(step);
                    });

                    rows.push({ group, data: rowData, total: rowTotal, stopLoss: stopLossCount, unrealizedSteps });
                });

                rows.sort((a, b) => {
                    if (b.total !== a.total) return b.total - a.total;
                    return a.group.localeCompare(b.group);
                });

                const minDca = allDcaValues.length > 0 ? Math.min(...allDcaValues) : 0;
                const maxDcaVal = allDcaValues.length > 0 ? Math.max(...allDcaValues) : 0;
                const minStop = stopValues.length > 0 ? Math.min(...stopValues) : 0;
                const maxStop = stopValues.length > 0 ? Math.max(...stopValues) : 0;
                const minUnrealized = unrealizedPositiveValues.length > 0 ? Math.min(...unrealizedPositiveValues) : 0;
                const maxUnrealized = unrealizedPositiveValues.length > 0 ? Math.max(...unrealizedPositiveValues) : 0;

                const totalColIndex = currentMaxDCA + 3;
                const stopLossColIndex = totalColIndex + 1;
                const spacerColIndex = stopLossColIndex + 1;
                const unrealizedStartColIndex = spacerColIndex + 1;

                rows.forEach(rowData => {
                    const unrealizedCells = [];
                    for (let i = 0; i < currentMaxUnrealizedColumns; i++) {
                        unrealizedCells.push(i < rowData.unrealizedSteps.length ? rowData.unrealizedSteps[i] : '');
                    }

                    const rowValues = [
                        rowData.group,
                        ...rowData.data,
                        rowData.total,
                        (rowData.stopLoss > 0 ? rowData.stopLoss : '-'),
                        '',
                        ...unrealizedCells
                    ];

                    const row = worksheet.addRow(rowValues);

                    row.eachCell((cell, colNumber) => {
                        cell.border = {
                            top: { style: 'thin' }, left: { style: 'thin' },
                            bottom: { style: 'thin' }, right: { style: 'thin' }
                        };
                        cell.alignment = { vertical: 'middle', horizontal: 'center' };

                        if (colNumber === 1) {
                            cell.font = { bold: true };
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF9F9F9' } };
                            cell.alignment = { vertical: 'middle', horizontal: 'left' };
                        } else if (colNumber > 1 && colNumber < totalColIndex) {
                            const val = cell.value;
                            if (typeof val === 'number' && val > 0) {
                                const color = getCommonColor(val, minDca, maxDcaVal);
                                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + color.hex } };
                                cell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
                            } else {
                                cell.value = '-';
                                cell.font = { color: { argb: 'FFCCCCCC' } };
                            }
                        } else if (colNumber === totalColIndex) {
                            cell.font = { bold: true };
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0F0F0' } };
                        } else if (colNumber === stopLossColIndex) {
                            const val = rowData.stopLoss;
                            if (typeof val === 'number' && val > 0) {
                                const color = getCommonColor(val, minStop, maxStop);
                                cell.value = val;
                                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + color.hex } };
                                cell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
                            } else {
                                cell.value = '-';
                                cell.font = { color: { argb: 'FFCCCCCC' }, bold: true };
                            }
                        } else if (colNumber === spacerColIndex) {
                            cell.value = '';
                        } else if (colNumber >= unrealizedStartColIndex) {
                            const arrayIndex = colNumber - unrealizedStartColIndex;
                            const unrealizedValue = arrayIndex < rowData.unrealizedSteps.length ? rowData.unrealizedSteps[arrayIndex] : '';
                            paintExcelValueCell(cell, unrealizedValue, minUnrealized, maxUnrealized, true);
                        }
                    });
                });

                worksheet.columns.forEach((column, index) => {
                    let maxLength = 0;
                    column.eachCell({ includeEmpty: true }, (cell) => {
                        const columnLength = cell.value ? cell.value.toString().length : 2;
                        if (columnLength > maxLength) maxLength = columnLength;
                    });

                    if (index + 1 === spacerColIndex) {
                        column.width = 3;
                    } else {
                        column.width = maxLength < 10 ? 10 : maxLength + 2;
                    }
                });

                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = window.URL.createObjectURL(blob);
                const anchor = document.createElement('a');
                anchor.href = url;
                anchor.download = `DCA_Analysis_${new Date().toISOString().split('T')[0]}.xlsx`;
                anchor.click();
                window.URL.revokeObjectURL(url);

                showSuccess('Excel 파일이 다운로드되었습니다!');
            } catch (error) {
                console.error('Excel Export Error:', error);
                showError('Excel 내보내기 중 오류가 발생했습니다.');
            }
        }

        document.getElementById('exportBtn').addEventListener('click', exportToExcel);
    </script>
</body>
